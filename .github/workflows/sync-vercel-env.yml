# Idempotent sync of application env vars (DATABASE_URL, RESEND_TOKEN,
# RESEND_FROM, CLERK_WEBHOOK_SECRET) into the 3 Vercel projects
# (executar-nf-web/app/api), scoped per environment (Preview vs
# Production differ per project — see the matrix below), followed by a
# real preview redeploy + health check + (for the API project, when a
# Clerk secret is configured) a genuine signed-webhook round trip —
# not just "the write call returned 200".
#
# Reuses the same secrets/vars deploy-web.yml and deploy-mobile.yml
# already reference (VERCEL_TOKEN, vars.VERCEL_ORG_ID,
# VERCEL_PROJECT_ID_APP/WEB/API) rather than inventing new names, and
# the same job-level-env-then-step-if pattern ci.yml's own history
# (ADR-DS-001, PR #13) established for reading `secrets` in a
# conditional: `secrets` is only valid in `env:`/`with:`/`run:`, never
# directly in `if:`.
#
# Gated on `vars.VERCEL_ORG_ID != ''` so this safely no-ops (not errors)
# until real Vercel credentials exist — same convention as
# deploy-web.yml/deploy-mobile.yml. Each individual var is independently
# gated on its own secret being present, so partial configuration (e.g.
# DATABASE_URL set but CLERK_WEBHOOK_SECRET not yet) still does useful
# work instead of failing outright.
#
# Never echoes a secret value. The sync script only logs key names,
# targets, and whether a write happened; the Clerk check logs pass/fail,
# never the secret.
name: Sync Vercel Env

on:
  workflow_dispatch:
    inputs:
      redeploy_production:
        description: "Also dispatch Deploy Web (production) after syncing — off by default so a routine env sync never pushes production on its own."
        type: boolean
        default: false

concurrency:
  group: sync-vercel-env
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # only used to dispatch Deploy Web when redeploy_production is explicitly true

jobs:
  sync:
    name: Sync + verify ${{ matrix.app }}
    if: vars.VERCEL_ORG_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            project_id_secret: VERCEL_PROJECT_ID_WEB
            database_url_targets: "production,preview"
            health_path: /en
          - app: app
            project_id_secret: VERCEL_PROJECT_ID_APP
            database_url_targets: "preview" # production's DATABASE_URL already works (M21/W1.1 reconciliation)
            health_path: /sign-in
          - app: api
            project_id_secret: VERCEL_PROJECT_ID_API
            database_url_targets: "preview" # production's DATABASE_URL already works
            health_path: /health
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_ORG_ID }}
      PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      RESEND_TOKEN_VALUE: ${{ secrets.RESEND_TOKEN }}
      RESEND_FROM_VALUE: ${{ secrets.RESEND_FROM }}
      CLERK_WEBHOOK_SECRET_VALUE: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_RESEND: ${{ secrets.RESEND_TOKEN != '' && secrets.RESEND_FROM != '' }}
      HAS_CLERK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync DATABASE_URL
        if: env.HAS_DATABASE_URL == 'true'
        run: bash scripts/sync-vercel-env.sh
        env:
          ENV_KEY: DATABASE_URL
          ENV_VALUE: ${{ env.DATABASE_URL_VALUE }}
          ENV_TARGETS: ${{ matrix.database_url_targets }}

      - name: Sync RESEND_TOKEN
        if: env.HAS_RESEND == 'true'
        run: bash scripts/sync-vercel-env.sh
        env:
          ENV_KEY: RESEND_TOKEN
          ENV_VALUE: ${{ env.RESEND_TOKEN_VALUE }}
          ENV_TARGETS: production,preview

      - name: Sync RESEND_FROM
        if: env.HAS_RESEND == 'true'
        run: bash scripts/sync-vercel-env.sh
        env:
          ENV_KEY: RESEND_FROM
          ENV_VALUE: ${{ env.RESEND_FROM_VALUE }}
          ENV_TARGETS: production,preview

      # Deliberately validated, never invented: only runs when a real
      # secrets.CLERK_WEBHOOK_SECRET exists. This step upserts it; the
      # LATER "Verify Clerk webhook signature" step is what actually
      # proves the value works end-to-end, not this write call
      # succeeding — a syntactically valid "whsec_..." string that
      # doesn't match Clerk's own configured secret would upsert fine
      # here and still fail that later check.
      - name: Sync CLERK_WEBHOOK_SECRET (api only)
        if: matrix.app == 'api' && env.HAS_CLERK_SECRET == 'true'
        run: bash scripts/sync-vercel-env.sh
        env:
          ENV_KEY: CLERK_WEBHOOK_SECRET
          ENV_VALUE: ${{ env.CLERK_WEBHOOK_SECRET_VALUE }}
          ENV_TARGETS: production,preview

      - name: Install Vercel CLI
        if: env.HAS_DATABASE_URL == 'true' || env.HAS_RESEND == 'true' || (matrix.app == 'api' && env.HAS_CLERK_SECRET == 'true')
        run: npm install --global vercel@latest

      # A new env var only takes effect on the NEXT build — Vercel does
      # not hot-reload existing deployments. This deploys a fresh
      # PREVIEW build from the current ref so the sync above is actually
      # exercised now, rather than waiting for the next incidental push.
      - name: Redeploy preview with the synced vars
        id: deploy
        if: env.HAS_DATABASE_URL == 'true' || env.HAS_RESEND == 'true' || (matrix.app == 'api' && env.HAS_CLERK_SECRET == 'true')
        working-directory: apps/${{ matrix.app }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Health check
        if: steps.deploy.outputs.url != ''
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}${{ matrix.health_path }}")
          echo "HTTP $status from ${{ steps.deploy.outputs.url }}${{ matrix.health_path }}"
          if [ "$status" -ge 500 ]; then
            echo "::error::${{ matrix.app }} preview returned a server error ($status) after the env sync — see the deployment's build logs before assuming the sync itself is at fault."
            exit 1
          fi

      # The one check in this workflow that proves CLERK_WEBHOOK_SECRET
      # is correct, not just present and correctly formatted: builds a
      # real Svix-signed request with the value just synced and confirms
      # the freshly deployed endpoint accepts it (HTTP 201), which only
      # happens if this value matches what Clerk's own webhook sender
      # would sign with.
      - name: Verify Clerk webhook signature (api only)
        if: matrix.app == 'api' && env.HAS_CLERK_SECRET == 'true' && steps.deploy.outputs.url != ''
        run: node scripts/verify-clerk-webhook-signature.mjs
        env:
          CLERK_WEBHOOK_SECRET: ${{ env.CLERK_WEBHOOK_SECRET_VALUE }}
          TARGET_URL: ${{ steps.deploy.outputs.url }}/webhooks/auth

  redeploy-production:
    name: Dispatch Deploy Web (production)
    needs: sync
    if: vars.VERCEL_ORG_ID != '' && github.event.inputs.redeploy_production == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger deploy-web.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-web.yml/dispatches" \
            -d '{"ref":"main"}'
