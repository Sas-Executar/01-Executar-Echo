# DEVOPS-003 / DEVOPS-004: migrations -> deploy -> smoke checks.
# Pushes deploy only when credentials exist; explicit dispatch fails if blocked.
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Validate configuration and apply production migrations
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate shared deployment configuration
        id: config
        run: bash scripts/load-deployment-config.sh web
      - name: Setup Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Migrate deploy (production)
        if: steps.config.outputs.ready == 'true'
        working-directory: packages/database
        run: bunx prisma migrate deploy --schema=./prisma/schema.prisma

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: migrate
    if: needs.migrate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app
            health_path: /sign-in
          - app: web
            health_path: /en
          - app: api
            health_path: /health
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_APP: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load shared deployment configuration
        run: bash scripts/load-deployment-config.sh web
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # The build runs on Vercel, not locally: a "sensitive" env var
      # (e.g. CLERK_WEBHOOK_SECRET, OPENAI_API_KEY) can never be pulled
      # down by the CLI by Vercel's own design, so a local `vercel build`
      # would see a "[SENSITIVE]" placeholder instead and fail any
      # strict runtime env schema expecting a real prefix. A plain
      # `vercel deploy` uploads the source and builds remotely, where
      # the real values are injected directly.
      #
      # Runs from the repo root, not apps/<app>: each project's own
      # Settings already has rootDirectory=apps/<app>, resolved by
      # Vercel relative to the repo root. Running from inside the app
      # directory doubles that path (apps/api/apps/api) and 404s.
      # The raw per-deployment URL `vercel deploy` prints can carry
      # Vercel's own Deployment Protection (SSO), which 302s any request
      # without a Vercel session — including this job's health check,
      # even though the deployment itself is healthy. The project's
      # stable production alias (e.g. executar-nf-api.vercel.app) isn't
      # protected the same way, so health checks target that instead.
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          host="${url#https://}"
          alias_host=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
            | jq -r '.alias[0] // empty')
          if [ -n "$alias_host" ]; then
            echo "health_url=https://$alias_host" >> "$GITHUB_OUTPUT"
          else
            echo "health_url=$url" >> "$GITHUB_OUTPUT"
          fi
      - name: Health check
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.health_url }}
          HEALTH_PATH: ${{ matrix.health_path }}
        run: bash scripts/check-deployment-health.sh
