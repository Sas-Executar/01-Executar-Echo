# M17-T04 — the first real lint/typecheck/test gate on every PR. Before
# this, the repo's only workflows were release.yml (publishes the
# next-forge CLI to npm on push to main) and security.yml (M16,
# secrets/dependency scanning) — nothing ran on a pull request at all.
# `build` is deliberately not a job here yet: `apps/web`'s BaseHub
# dependency was removed (content is local MDX now, see
# packages/cms/index.ts) but `apps/app` still needs a live Postgres +
# Clerk keys neither this workflow nor this repo's CI secrets currently
# carry. A real build/deploy gate is M19's job (CD Web/Mobile), not this
# one's.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deployment-config:
    name: Deployment configuration regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shell syntax
        run: bash -n scripts/load-deployment-config.sh scripts/sync-vercel-env.sh scripts/check-deployment-health.sh
      - name: Test gates, secret rotation and health checks
        run: node --test scripts/deployment-config.test.mjs

  lint:
    name: Lint (ultracite/biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx ultracite check .

  typecheck:
    name: Typecheck (tsc, every package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/database/generated is gitignored (Prisma-generated) —
      # without this, @repo/database's own exports don't resolve and
      # typecheck fails on every package that imports it. Confirmed by
      # actually deleting the directory and re-running typecheck, not
      # assumed. Must run from packages/database (matches its own
      # `build` script, root package.json's `migrate` script) — running
      # `bunx prisma` from the repo root resolves a different, unrelated
      # top-level `prisma` package instead and silently mutates
      # bun.lock; also confirmed by actually trying it, not assumed.
      - name: Generate Prisma client
        working-directory: packages/database
        run: bunx prisma generate --no-hints --schema=./prisma/schema.prisma

      - name: Typecheck
        run: bun run typecheck

  token-drift:
    name: Design tokens drift (ADR-DS-001)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # packages/design-tokens/css/variables.css is hand-authored to
      # mirror packages/design-tokens/src/*.ts 1:1 (ADR-DS-001 Required
      # Change #10) — this script diffs the two and fails the build if
      # anyone edits one without the other.
      - name: Check CSS/TS token drift
        run: bun run packages/design-tokens/scripts/check-drift.ts

  editorial-isolation:
    name: Editorial/product design-system isolation (ADR-DS-002)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/web carries the public NatGeo-hybrid identity
      # (@repo/editorial-tokens) alongside the product Design System
      # (@repo/design-tokens). They only coexist safely because the
      # editorial set is scoped to [data-surface="editorial"] and the
      # product set is never edited to suit a public page. Breaking that
      # shows up as apps/app or apps/mobile changing colour, which is
      # exactly the kind of regression nobody spots in a diff — so it is
      # asserted here rather than trusted.
      - name: Check editorial token drift and scope
        run: bun run packages/editorial-tokens/scripts/check-drift.ts

      - name: Check product design system is untouched
        run: bash scripts/check-editorial-isolation.sh

  # ADR-DS-001 Required Change #9 — Storybook visual regression. Runs
  # only once a real CHROMATIC_PROJECT_TOKEN repo secret exists (no
  # Chromatic connector to provision one automatically here). GitHub
  # Actions does not expose the `secrets` context to *any* `if:`
  # condition — job-level or step-level — confirmed the hard way: this
  # job originally gated itself with a job-level
  # `if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}`, which failed the
  # whole workflow file to parse ("Unrecognized named-value: 'secrets'"),
  # silently skipping every job here on every push since ADR-DS-001. A
  # first attempted fix moved the same `secrets.…` expression onto each
  # step's own `if:` instead — same error, same position, still invalid;
  # `secrets` genuinely isn't readable from an `if:` anywhere, only from
  # `env:`/`with:`/`run:`. The actual fix: copy the secret into a job-level
  # `env:` (env assignment, unlike `if:`, can read `secrets`), then gate
  # each step on that `env` value instead — the `env` context *is* valid
  # in step-level `if:`. Until the secret exists, every step below
  # no-ops and the job reports success, so CI stays honest about what it
  # does and doesn't cover without failing the file to parse.
  visual-regression:
    name: Storybook visual regression (Chromatic)
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: bun install --frozen-lockfile

      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        working-directory: apps/storybook
        run: bunx chromatic --exit-zero-on-changes

  test:
    name: Unit tests (vitest, every package)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/database
        run: bunx prisma generate --no-hints --schema=./prisma/schema.prisma

      # No DATABASE_URL/OPENAI_API_KEY/STRIPE_SECRET_KEY/Clerk keys are
      # set here on purpose: every DB- or credential-backed suite in
      # this repo uses the same `describe.skipIf(!process.env.X)` +
      # dynamic-import pattern (packages/database/__tests__/rls.test.ts
      # and every suite that follows its lead) so `bun run test` stays
      # real and green without secrets — this job proves that, it
      # doesn't work around a gap. `packages/agent-runtime`'s eval
      # harness (M17-T03) is included here too: it's part of the normal
      # `test` task, not a separate job — see QUALITY_GATES.md for why
      # "agent evals" is still listed as its own named gate.
      - name: Test
        run: bun run test
