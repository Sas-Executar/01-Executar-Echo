# DEVOPS-003 / DEVOPS-004. app.json is the EAS project identity source.
# main push: OTA. mobile-v* tag: native build. Dispatch submit: stores only.
name: Deploy Mobile

on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the latest production build to the app stores"
        type: boolean
        default: false

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy mobile
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      REQUEST_SUBMIT: ${{ github.event.inputs.submit || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select operation
        id: operation
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REQUEST_SUBMIT" = true ]; then
            operation=submit
          elif [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            operation=build
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            operation=update
          else
            echo '::error::Select main for OTA or a mobile-v tag for native builds.'
            exit 1
          fi
          echo "MOBILE_ACTION=$operation" >> "$GITHUB_ENV"
          echo "action=$operation" >> "$GITHUB_OUTPUT"
      - name: Validate shared deployment and EAS configuration
        id: config
        run: bash scripts/load-deployment-config.sh mobile
      - name: Setup Bun
        if: steps.config.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Setup Expo/EAS
        if: steps.config.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Publish OTA update
        if: steps.config.outputs.ready == 'true' && steps.operation.outputs.action == 'update'
        working-directory: apps/mobile
        run: eas update --branch "$EAS_UPDATE_BRANCH" --message "$GITHUB_SHA" --non-interactive
      - name: Queue native build
        if: steps.config.outputs.ready == 'true' && steps.operation.outputs.action == 'build'
        working-directory: apps/mobile
        run: |
          eas build --platform all --profile "$EAS_BUILD_PROFILE" --non-interactive --no-wait
          echo 'Native build queued; completion must be verified in EAS.' >> "$GITHUB_STEP_SUMMARY"
      - name: Submit latest production build
        if: steps.config.outputs.ready == 'true' && steps.operation.outputs.action == 'submit'
        working-directory: apps/mobile
        run: eas submit --platform all --profile "$EAS_BUILD_PROFILE" --non-interactive --latest
