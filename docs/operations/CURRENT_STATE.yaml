verified_fix_oops_screen:
  status: VERIFIED_LIVE
  commit: "240a122a6adb21d4876ba54508f5a6a8f8481977"
  what: >
    The user-visible "Oops, something went wrong" screen on apps/app was
    caused by (authenticated)/page.tsx calling database.page.findMany()
    before auth() had established an orgId. Page and layout render
    concurrently, so signed-out visits ran that Prisma query anyway, it
    threw, and the throw reached global-error.tsx ahead of the layout's
    redirect.
  evidence_before: >
    RSC payload on the branch preview carried two errors --
    NEXT_REDIRECT (expected) AND digest 2873733393@E394 (the crash).
  evidence_after: >
    Same URL, same method (mcp__Vercel__web_fetch_vercel_url, which
    passes Vercel SSO): digest 2873733393@E394 is gone. Only
    NEXT_HTTP_ERROR_FALLBACK;404 and NEXT_REDIRECT remain -- both are
    normal Next.js control-flow sentinels, not crashes. Location header
    correctly points at endless-hornet-1964.accounts.dev/sign-in.
  merged_to_production: >
    PR #33 merged to main by the user (2026-09-21, commit fe54b6b,
    squash merge). Production deployment dpl_3NGW3Dj6iGF53f2cVMJQzvzXo5uX
    READY. Re-verified directly against https://executar-nf-app.vercel.app/
    (production alias, not preview): 5/5 curl -> 307, no 500s. RSC payload
    via mcp__Vercel__web_fetch_vercel_url shows only
    NEXT_HTTP_ERROR_FALLBACK;404 and NEXT_REDIRECT -- digest
    2873733393@E394 does not appear. sentry-release header confirms
    fe54b6b is the code actually serving the request. CLOSED.

